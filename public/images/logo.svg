<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243A" />
      <stop offset="100%" stop-color="#1F395B" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCE44" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743" />
      <stop offset="100%" stop-color="#C86A28" />
    </linearGradient>
  </defs>

  <!-- Icon emblem -->
  <g transform="translate(10, 10)">
    <rect width="70" height="70" rx="16" fill="url(#bgBox)" />
    <!-- Stator coil ring -->
    <circle cx="35" cy="35" r="26" fill="none" stroke="url(#copper)" stroke-width="2.5" stroke-dasharray="5 2.5" />
    <circle cx="35" cy="35" r="20" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3" />
    <!-- Lightning bolt -->
    <path d="M38 16 L25 37 L35 37 L32 54 L47 33 L36 33 Z" fill="url(#boltGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(94, 28)">
    <!-- Sri Venkateswara -->
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-weight="800" font-size="20" fill="#14243A" letter-spacing="0.5">
      SRI VENKATESWARA
    </text>
    <!-- Electrical & Rewinding Works -->
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-weight="700" font-size="14" fill="#F5A623" letter-spacing="1.2">
      ELECTRICAL &amp; REWINDING WORKS
    </text>
    <!-- Rajahmundry Location / Service Tag -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.8">
      RAJAHMUNDRY • APPLIANCE SERVICES
    </text>
  </g>
</svg>
